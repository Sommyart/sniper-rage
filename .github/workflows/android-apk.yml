name: Build Android APK

# The app carries the whole game inside it (Capacitor), so it never opens a
# browser or loads from the web. Later builds reach it through the in-game
# update banner, which downloads public/app/bundle-vNN.zip from the site.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the game
        run: node build/package.js

      - name: Create the Capacitor project
        run: |
          mkdir app && cd app
          echo '{"name":"sniper-rage-app","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@^6 @capacitor/android@^6 @capacitor/cli@^6 @capgo/capacitor-updater@^6
          cp ../build/android/capacitor.config.json .
          mkdir www
          cp ../public/index.html ../public/manifest.webmanifest ../public/icon-*.png www/
          cp -r ../public/assets www/assets
          npx cap add android

      - name: Landscape, full screen, app icon
        working-directory: app
        run: |
          cp ../build/android/MainActivity.java android/app/src/main/java/com/sommyart/sniperrage/MainActivity.java
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          mkdir -p assets
          cp ../public/icon-512.png assets/icon-only.png
          cp ../public/icon-512.png assets/icon-foreground.png
          cp ../public/icon-512.png assets/splash.png
          cp ../public/icon-512.png assets/splash-dark.png
          npx --yes @capacitor/assets@^3 generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000' || echo "icon generation skipped"
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SniperRage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SniperRage-apk
          path: SniperRage.apk

      - name: Publish to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest SniperRage.apk --title "Sniper Rage Android app" --notes "Offline Android build. Later updates arrive inside the game." --latest
