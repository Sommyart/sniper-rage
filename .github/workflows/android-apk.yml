name: Build Android APK

# The app carries the whole game inside it (Capacitor), so it never opens a
# browser or loads from the web. Later builds reach it through the in-game
# update banner, which downloads public/app/bundle-vNN.zip from the site.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the game
        run: node build/package.js

      - name: Create the Capacitor project
        run: |
          mkdir app && cd app
          echo '{"name":"sniper-rage-app","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7 @capgo/capacitor-updater@^7
          cp ../build/android/capacitor.config.json .
          mkdir www
          cp ../public/index.html ../public/manifest.webmanifest ../public/icon-*.png www/
          cp -r ../public/assets www/assets
          npx cap add android

      - name: Landscape, full screen, app icon
        working-directory: app
        run: |
          cp ../build/android/MainActivity.java android/app/src/main/java/com/sommyart/sniperrage/MainActivity.java
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r ../build/android/res/* android/app/src/main/res/
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle.log
          cp app/build/outputs/apk/debug/app-debug.apk ../../SniperRage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SniperRage-apk
          path: SniperRage.apk

      - name: Publish to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest SniperRage.apk --title "Sniper Rage Android app" --notes "Offline Android build. Later updates arrive inside the game." --latest

      - name: Keep the build log where it can be read
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs || true
          git switch --orphan ci-logs-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          tail -n 300 gradle.log > build-failure.log 2>/dev/null || echo "no gradle log" > build-failure.log
          git add -f build-failure.log
          git commit -m "CI build log"
          git push -f origin HEAD:ci-logs
